<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unsubscribed — The SOS App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0A0C10;
      --bg2: #111318;
      --gold: #D4A853;
      --gold-dim: #A07D3A;
      --red: #E74C3C;
      --fg: #F0EDE6;
      --fg2: #9A978F;
      --dim: #5C5A55;
      --border: #2A2D36;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--fg2); line-height: 1.8; overflow-x: hidden; font-size: 0.95rem; min-height: 100vh; display: flex; flex-direction: column; }

    nav.topnav {
      position: sticky; top: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 40px;
      backdrop-filter: blur(20px);
      background: rgba(10,12,16,.88);
      border-bottom: 1px solid var(--border);
    }
    .nav-brand { font-family: 'Instrument Serif', serif; font-size: 1.6rem; color: var(--fg); text-decoration: none; letter-spacing: -0.02em; }
    .nav-brand span { color: var(--gold); }
    .nav-links { display: flex; gap: 32px; list-style: none; }
    .nav-links a { color: var(--fg2); text-decoration: none; font-size: .88rem; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; transition: color .3s; }
    .nav-links a:hover { color: var(--gold); }

    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 24px; }

    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 56px 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .logo {
      width: 72px; height: 72px;
      background: var(--red);
      border-radius: 18px;
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 28px;
    }
    .logo span { color: #fff; font-weight: 900; font-size: 22px; letter-spacing: 1px; font-family: 'DM Sans', sans-serif; }

    h1 { font-family: 'Instrument Serif', serif; font-size: 1.8rem; color: var(--fg); letter-spacing: -0.02em; margin-bottom: 12px; }

    p { font-size: .92rem; color: var(--fg2); margin-bottom: 8px; }

    .divider { border: none; border-top: 1px solid var(--border); margin: 28px 0; }

    a.btn {
      display: inline-block; background: var(--red); color: #fff;
      padding: 11px 28px; border-radius: 100px;
      font-weight: 600; font-size: .88rem; text-decoration: none;
      transition: opacity .2s; margin-top: 8px;
    }
    a.btn:hover { opacity: .85; }

    .note { font-family: 'JetBrains Mono', monospace; font-size: .72rem; color: var(--dim); letter-spacing: .03em; margin-top: 20px; }
    .note a { color: var(--gold); text-decoration: none; }
    .note a:hover { text-decoration: underline; }

    footer { border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 30px 40px; color: var(--dim); font-size: .82rem; }
    footer a { color: var(--dim); text-decoration: none; margin-left: 1.5rem; transition: color .3s; }
    footer a:hover { color: var(--gold); }

    @media (max-width: 600px) {
      nav.topnav { padding: 16px 20px; }
      .nav-links { gap: 18px; }
      .card { padding: 40px 28px; }
      footer { flex-direction: column; gap: 14px; text-align: center; padding: 22px; }
      footer a { margin-left: .6rem; }
    }
  </style>
</head>
<body>

<nav class="topnav">
  <a class="nav-brand" href="index.html">Scintilla<span>Dev</span></a>
  <ul class="nav-links">
    <li><a href="index.html#apps">Apps</a></li>
    <li><a href="index.html#about">About</a></li>
    <li><a href="index.html#support">Support</a></li>
  </ul>
</nav>

<main>
  <div class="card">
    <div class="logo"><span>SOS</span></div>
    <h1>You've been unsubscribed.</h1>
    <p>You won't receive any more emails from The SOS App.</p>
    <hr class="divider">
    <p>Changed your mind?</p>
    <a class="btn" href="mailto:marcio@thesosapp.com">Email us to re-subscribe</a>
    <p class="note">Or go back to <a href="../index.html">scintilladev.com</a></p>
  </div>
</main>

<footer>
  <span>&copy; 2026 Scintilla Dev</span>
  <div>
    <a href="sos-privacy-policy.html">Privacy</a>
    <a href="sos-terms.html">Terms</a>
    <a href="index.html#support">Support</a>
  </div>
</footer>

</body>
</html>
